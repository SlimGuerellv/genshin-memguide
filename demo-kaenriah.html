<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Демка: Каэнри'ах</title>
<style>
@font-face{font-family:'WhoAsksSatan';src:url('kn_font.ttf') format('truetype');font-display:block}
:root{--red:#ff2a2a;--vio:#8a3cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#05070c;color:#e8e6f0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}

/* ---------- заглушка глобуса: карта Сумеру + верхні кнопки ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:56px 16px 16px}
.mapbox{position:relative;width:min(100%,calc((100vh - 80px)*748/510),1100px);aspect-ratio:748/510;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.6)}
.mapbox>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.demo-btns{position:fixed;top:12px;right:14px;display:flex;gap:10px;z-index:5}
.demo-btns span{padding:9px 16px;border-radius:12px;background:rgba(20,24,36,.7);border:1px solid rgba(255,255,255,.12);font-size:14px;backdrop-filter:blur(8px)}
.demo-note{position:fixed;left:14px;top:14px;font-size:13px;opacity:.55;max-width:46vw;z-index:5}

/* ---------- точка (як .gpin на глобусі) ---------- */
.kpin{position:absolute;left:57%;top:65.3%;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;background:none;padding:0;cursor:pointer;z-index:3}
.kpin:hover,.kpin:focus-visible,.kpin.tap{z-index:6}
.kpin .ic{position:absolute;left:50%;top:50%;width:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px rgba(255,30,30,.95)) drop-shadow(0 0 14px rgba(255,30,30,.55));transition:transform .25s,filter .25s;display:block;pointer-events:none}
.kpin::before,.kpin::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,40,40,.7);transform:translate(-50%,-50%) scale(.5);opacity:0;animation:ring 2.6s ease-out infinite;pointer-events:none}
.kpin::after{animation-delay:1.3s}
@keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
.kpin:hover .ic,.kpin:focus-visible .ic,.kpin.tap .ic{transform:translate(-50%,-50%) scale(1.22);filter:drop-shadow(0 0 7px #ff3030) drop-shadow(0 0 22px rgba(255,30,30,.85))}
.kpin:focus-visible{outline:none}

/* картка при наведенні */
.kcard{position:absolute;left:50%;bottom:calc(100% + 4px);width:236px;transform:translate(-50%,8px) scale(.96);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  background:rgba(16,12,22,.94);border:1px solid rgba(255,60,60,.38);border-radius:12px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.65),0 0 24px rgba(255,30,30,.16);text-align:left}
.kpin:hover .kcard,.kpin:focus-visible .kcard,.kpin.tap .kcard{opacity:1;transform:translate(-50%,0) scale(1)}
.kcard i{display:block;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.kcard b{display:block;padding:9px 12px 0;font-size:15px;color:#fff;letter-spacing:.2px}
.kcard em{display:block;padding:2px 12px 10px;font-style:normal;font-size:12.5px;color:#ff9a9a;opacity:.9}

/* ---------- повноекранна сцена ---------- */
#kn{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 45%,#120708 0%,#050506 55%,#000 100%);visibility:hidden;opacity:0;transition:opacity .9s ease,visibility 0s .9s;overflow:hidden}
#kn.on{visibility:visible;opacity:1;transition:opacity .9s ease}
#kn .eye{position:absolute;left:50%;top:50%;width:min(1400px,100vw,100vh);height:min(1400px,100vw,100vh);transform:translate(-50%,-50%);opacity:0;transition:opacity 2.2s ease .5s;
  /* арт не обрізаємо і не збільшуємо: по краях плавний перехід у чорний */
  -webkit-mask-image:radial-gradient(circle at center,#000 38%,rgba(0,0,0,.55) 52%,transparent 71%);mask-image:radial-gradient(circle at center,#000 38%,rgba(0,0,0,.55) 52%,transparent 71%)}
#kn .eye img{width:100%;height:100%;display:block;object-fit:contain;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
#kn.on .eye{opacity:1}
#kn.dark .eye{opacity:.05;transition:opacity 2.4s ease}
#kn.who-on .eye{opacity:0;transition:opacity 1.6s ease}

/* вогонь знизу */
#kn .glow{position:absolute;left:0;right:0;bottom:0;height:75%;opacity:0;transition:opacity 2.6s ease;pointer-events:none;
  background:
   radial-gradient(70% 55% at 50% 108%,rgba(255,40,30,.75),rgba(255,40,30,0) 70%),
   radial-gradient(90% 70% at 20% 112%,rgba(150,50,255,.55),rgba(150,50,255,0) 65%),
   radial-gradient(90% 70% at 82% 112%,rgba(150,50,255,.5),rgba(150,50,255,0) 65%),
   linear-gradient(to top,rgba(110,30,200,.28),rgba(110,30,200,0) 80%);
  animation:flick 2.3s ease-in-out infinite;mix-blend-mode:screen}
#kn.fire .glow{opacity:1}
@keyframes flick{0%,100%{filter:brightness(1);transform:scaleY(1)}20%{filter:brightness(1.18);transform:scaleY(1.04)}45%{filter:brightness(.88);transform:scaleY(.97)}70%{filter:brightness(1.12);transform:scaleY(1.03)}}
#kn canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}

/* персонаж */
#kn .who{mix-blend-mode:screen;position:absolute;left:50%;bottom:0;height:min(80vh,100vw,780px);aspect-ratio:1;transform:translate(-50%,40px);opacity:0;filter:blur(10px) brightness(.6);pointer-events:none;
  transition:opacity 2.6s ease,transform 3s cubic-bezier(.2,.7,.2,1),filter 2.8s ease;
  -webkit-mask-image:radial-gradient(ellipse 47% 80% at 50% 55%,#000 52%,rgba(0,0,0,.7) 70%,rgba(0,0,0,.25) 86%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 7%);-webkit-mask-composite:source-in;
  mask-image:radial-gradient(ellipse 47% 80% at 50% 55%,#000 52%,rgba(0,0,0,.7) 70%,rgba(0,0,0,.25) 86%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 7%);mask-composite:intersect}
#kn .who img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 22px rgba(255,40,40,.35))}
#kn.who-on .who{opacity:1;transform:translate(-50%,0);filter:blur(0) brightness(1)}
#kn.who-on .who img{animation:glitch 6s steps(1) infinite}
@keyframes glitch{0%,92%,100%{transform:none;filter:drop-shadow(0 0 22px rgba(255,40,40,.35))}93%{transform:translate(-5px,0);filter:drop-shadow(5px 0 0 rgba(255,0,60,.7)) drop-shadow(-5px 0 0 rgba(0,200,255,.5))}94%{transform:translate(4px,1px)}95%{transform:none}96%{transform:translate(-2px,0);filter:drop-shadow(0 0 22px rgba(255,40,40,.35))}}


/* напис зверху: золото ↔ фіолет із чорним, моторошний */
#kn .quote{position:absolute;left:50%;top:clamp(30px,7vh,76px);transform:translateX(-50%);width:min(1120px,94vw);text-align:center;z-index:2;pointer-events:none;
  font-family:'WhoAsksSatan','Palatino Linotype',Georgia,serif;font-weight:400;letter-spacing:.05em;line-height:1.3;font-size:clamp(26px,3.8vw,56px);color:#e9c46a}
/* темна імла за текстом: щоб читалось і було тісно */
#kn .quote::before{content:"";position:absolute;inset:-34px -70px -26px;z-index:-1;background:radial-gradient(closest-side,rgba(0,0,0,.82),rgba(0,0,0,.45) 60%,transparent);filter:blur(6px)}
#kn .quote .w{position:relative;display:inline-block;margin:0 .22em;opacity:0;filter:blur(9px);transform:translateY(14px) scale(1.12) skewX(-6deg);
  transition:opacity 2s ease,filter 2s ease,transform 2s cubic-bezier(.2,.8,.2,1)}
/* привид слова: зсунута тінь, що дихає */
#kn .quote .w::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#7b2cff;opacity:0;filter:blur(2.5px);pointer-events:none}
#kn .quote.on .w{opacity:1;filter:blur(0);transform:none;animation:wtrem var(--td,3.7s) linear var(--tl,0s) infinite,wgone var(--gd,9s) steps(1) var(--gl,0s) infinite}
#kn .quote.on .w::before{animation:wecho var(--ed,3.2s) ease-in-out var(--tl,0s) infinite alternate}
@keyframes wtrem{0%,100%{translate:0 0;rotate:0deg}12%{translate:.8px -1px;rotate:-.25deg}27%{translate:-1px .6px;rotate:.3deg}43%{translate:.5px 1px;rotate:0deg}58%{translate:-.7px -.8px;rotate:-.35deg}74%{translate:1.2px .4px;rotate:.2deg}88%{translate:-.4px -.5px;rotate:0deg}}
@keyframes wecho{from{opacity:.0;translate:0 0}to{opacity:.55;translate:-5px 3px}}
@keyframes wgone{0%,94%,100%{opacity:1}95%{opacity:.08}96%{opacity:1}97%{opacity:.25}98%{opacity:1}}
/* останнє слово: кривавіє, тріщить, кровоточить */
#kn .quote .w.fail{margin-left:.25em;font-size:1.14em;color:#b3101a}
#kn .quote .w.fail::before{color:#ff2a3a;filter:blur(4px)}
#kn .quote.on .w.fail{animation:wtrem 1.1s linear infinite,failpulse 2.8s ease-in-out infinite,wgone 6s steps(1) 2s infinite;text-shadow:0 0 6px rgba(255,20,40,.95),0 0 24px rgba(220,0,20,.8),0 0 48px rgba(120,0,10,.7),0 2px 0 #200,0 5px 3px rgba(150,0,10,.9)}
#kn .quote.on .w.fail::before{animation:wecho 1.6s ease-in-out infinite alternate;opacity:.7}
@keyframes failpulse{0%,100%{color:#a30d18;filter:brightness(.9)}50%{color:#e0202e;filter:brightness(1.25)}}
#kn .quote .w.fail::after{content:"";position:absolute;left:0;right:0;top:78%;height:2.4em;pointer-events:none;transform-origin:top;transform:scaleY(0);opacity:0;
  background:linear-gradient(#c0101c,rgba(120,0,10,.8) 55%,transparent) 10% 0/.07em 70% no-repeat,
             linear-gradient(#c0101c,rgba(120,0,10,.8) 60%,transparent) 32% 0/.05em 100% no-repeat,
             linear-gradient(#c0101c,rgba(120,0,10,.8) 55%,transparent) 55% 0/.07em 55% no-repeat,
             linear-gradient(#c0101c,rgba(120,0,10,.8) 60%,transparent) 76% 0/.05em 85% no-repeat,
             linear-gradient(#c0101c,rgba(120,0,10,.8) 55%,transparent) 92% 0/.06em 62% no-repeat}
#kn .quote.on .w.fail::after{animation:drip 9s ease-in infinite 3s}
@keyframes drip{0%{transform:scaleY(0);opacity:0}8%{opacity:1}70%{transform:scaleY(1);opacity:1}92%{transform:scaleY(1.04);opacity:0}100%{transform:scaleY(0);opacity:0}}
/* весь рядок: золото ↔ фіолет з чорним, мерехтіння, рідкісний розрив */
#kn .quote.on{animation:qcol 11s ease-in-out infinite,qflick 8s linear infinite,qtear 6.7s steps(1) infinite}
@keyframes qcol{
 0%,30%{color:#f0cf7a;text-shadow:0 0 6px rgba(255,200,80,.95),0 0 18px rgba(255,160,30,.75),0 0 42px rgba(255,120,0,.45),0 0 2px #000,0 0 0 #000}
 50%,80%{color:#c3a0ff;text-shadow:0 0 6px rgba(150,80,255,.95),0 0 18px rgba(120,40,230,.8),0 0 42px rgba(70,0,160,.7),0 0 3px #000,0 3px 0 #000}
 100%{color:#f0cf7a;text-shadow:0 0 6px rgba(255,200,80,.95),0 0 18px rgba(255,160,30,.75),0 0 42px rgba(255,120,0,.45),0 0 2px #000,0 0 0 #000}}
@keyframes qflick{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}93.5%{opacity:.55}94%{opacity:1}97%{opacity:.7}97.6%{opacity:1}}
@keyframes qtear{0%,88%,100%{translate:0 0;filter:none}
 89%{translate:9px 0;filter:drop-shadow(-4px 0 rgba(255,0,60,.85)) drop-shadow(4px 0 rgba(0,210,255,.6))}
 90%{translate:-12px 2px;filter:drop-shadow(5px 0 rgba(255,0,60,.85)) drop-shadow(-5px 0 rgba(0,210,255,.6)) blur(1px)}
 91%{translate:5px -1px;filter:drop-shadow(-3px 0 rgba(255,0,60,.7))}
 92%{translate:0 0;filter:none}
 96%{translate:-6px 0;filter:drop-shadow(4px 0 rgba(150,60,255,.9))}97%{translate:0 0;filter:none}}


/* «power» періодично лагає у «ABYSS» (червоне, з кров'ю, як «failed») */
#kn .quote.on .w.gl{animation:wglit .09s steps(2) infinite!important;text-shadow:-4px 0 rgba(255,0,60,.95),4px 0 rgba(0,220,255,.85),0 0 10px rgba(255,0,60,.5)!important}
@keyframes wglit{0%{translate:-5px 1px;skew:-8deg}50%{translate:6px -2px}100%{translate:-2px 0}}
#kn .quote .w.abyss{letter-spacing:.09em}
#kn .quote.on .w.abyss::after{animation:drip 2.6s ease-out infinite 0s}


/* загальні глюки слів (g-*): без filter/opacity/transform, щоб не тягнулась transition */
#kn .quote.on .w.g-tear{animation:wtear .38s steps(1)!important}
@keyframes wtear{0%{clip-path:inset(0 0 58% 0);translate:-11px 0}22%{clip-path:inset(46% 0 0 0);translate:13px 0}46%{clip-path:inset(18% 0 40% 0);translate:-8px 0}70%{clip-path:inset(60% 0 0 0);translate:6px 0}100%{clip-path:inset(0);translate:0 0}}
#kn .quote.on .w.g-flip{scale:-1 1;text-shadow:3px 0 rgba(255,0,60,.9),-3px 0 rgba(0,220,255,.8)!important}
#kn .quote.on .w.g-str{scale:1 2.3;text-shadow:0 0 14px rgba(255,255,255,.8)!important}
#kn .quote.on .w.g-sq{scale:1.5 .22;text-shadow:0 0 8px rgba(255,0,60,.9)!important}
#kn .quote.on .w.g-big{scale:1.7;color:#fff!important;text-shadow:0 0 22px rgba(255,255,255,.9)!important}
#kn .quote.on .w.g-split::before{opacity:.95!important;translate:-16px 0;color:#ff2230;filter:none}
#kn .quote.on .w.g-split{text-shadow:7px 0 rgba(0,220,255,.8)!important}
#kn .quote.on .w.g-blk{color:#000!important;text-shadow:0 0 6px rgba(255,255,255,.55)!important}
#kn .quote.on .w.g-tilt{rotate:-14deg;translate:0 4px;text-shadow:-3px 0 rgba(255,0,60,.9)!important}
#kn .quote.on .w.g-jit{animation:wjit .06s steps(2) infinite!important;text-shadow:-3px 0 rgba(255,0,60,.9),3px 0 rgba(0,220,255,.8)!important}
@keyframes wjit{0%{translate:-6px -3px}50%{translate:7px 2px}100%{translate:-2px 4px}}


/* глюки з К. К., перенесені на слова */
#kn .quote.on .w.g-kc{color:#7ff!important;text-shadow:-3px 0 #f22,3px 0 #22f,0 0 8px #f22!important;translate:3px -2px}
#kn .quote.on .w.g-kr{color:#f44!important;text-shadow:2px 0 #0ff,-2px 0 #f00!important;filter:blur(.6px)}
#kn .quote.on .w.g-st{animation:wst .06s steps(2) 4!important}
@keyframes wst{0%{translate:0 0}50%{translate:-5px 0;color:#f66}100%{translate:4px 0}}
#kn .quote.on .w.g-bk{color:#1a1016!important;text-shadow:0 0 8px rgba(0,0,0,.9)!important}
#kn .quote.rgb .w{text-shadow:-4px 0 #f22,4px 0 #22f!important}
#kn .who img.kgl{translate:5px 0;filter:hue-rotate(60deg) saturate(1.6) contrast(1.3)!important;animation:none!important}

/* хрестик */
#knx{position:absolute;top:16px;right:18px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(10,8,14,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:3;opacity:0;transition:opacity 1.2s ease 1s,background .2s,border-color .2s;backdrop-filter:blur(6px)}
#kn.on #knx{opacity:.75}
#knx:hover{opacity:1;background:rgba(80,10,10,.7);border-color:rgba(255,80,80,.7)}
@media(prefers-reduced-motion:reduce){#kn .quote.on,#kn .quote.on .w,#kn .quote.on .w::before,#kn .quote.on .w::after{animation:none}#kn .eye img,#kn .glow,.kpin::before,.kpin::after,#kn.who-on .who img{animation:none}}
</style>
</head>
<body>
<div class="demo-note">ДЕМКА · Каэнри'ах. Наведи на червону точку, клікни. Хрестик або Esc закривають.</div>
<div class="demo-btns"><span>Что нового</span><span>Войти</span></div>

<div class="stage">
  <div class="mapbox">
    <img class="bg" src="kn_map.webp" alt="Сумеру" draggable="false">
    <button class="kpin" id="kpin" type="button" aria-label="Каэнри'ах">
      <img class="ic" src="kn_icon.png" alt="" draggable="false">
      <span class="kcard" role="tooltip"><i style="background-image:url(kn_door.webp)"></i><b>Каэнри'ах</b><em>Скрыто от глаз</em></span>
    </button>
  </div>
</div>

<div id="kn" aria-hidden="true" role="dialog" aria-label="Каэнри'ах">
  <div class="eye"><img src="kn_eye.webp" alt="" draggable="false"></div>
  <div class="glow"></div>
  <canvas id="knfx"></canvas>
  <div class="quote" id="knq" aria-label="For the nation, we can't forgo this skyborne power, but we failed"></div>
  <div class="who"><img src="kn_avatar.webp" alt="" draggable="false"></div>
  <button id="knx" type="button" aria-label="Закрыть">×</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KN = $('#kn'), pin = $('#kpin'), cv = $('#knfx'), cx = cv.getContext('2d');
  const QT = "For the nation, we can't forgo this skyborne power, but we failed", KQ = $('#knq');
  const WS = QT.split(' ');
  KQ.innerHTML = WS.map((w, i) => '<span class="w' + (i === WS.length - 1 ? ' fail' : '') + '" data-t="' + w + '" aria-hidden="true" style="transition-delay:' + (i * .3 + Math.random() * .2).toFixed(2) + 's;--td:' + (2.8 + Math.random() * 2.6).toFixed(2) + 's;--tl:-' + (Math.random() * 4).toFixed(2) + 's;--ed:' + (2.4 + Math.random() * 2.2).toFixed(2) + 's;--gd:' + (6 + Math.random() * 9).toFixed(2) + 's;--gl:-' + (Math.random() * 8).toFixed(2) + 's">' + w + '</span>').join(' ');
  const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* фоновий гул як у К. К. (av/kk_hum.mp3, 3%, зациклений); музика сайту на час сцени приглушується; без голосу */
  const hum = new Audio('av/kk_hum.mp3?v=1'); hum.loop = true; hum.preload = 'auto'; hum.volume = 0;
  const HUM_VOL = 0.03; let humRaf = 0, humWant = false;
  const muted = () => { try { return !!(window.gMusic && window.gMusic.sfxVol && window.gMusic.sfxVol() === 0); } catch (e) { return false; } };
  const duck = on => { try { if (window.gMusic) on ? window.gMusic.hush() : window.gMusic.unhush(); } catch (e) {} };
  function humTo(target, ms, done){
    cancelAnimationFrame(humRaf); const v0 = hum.volume, t0 = performance.now();
    (function st(t){ const k = Math.min(1, (t - t0) / ms); try { hum.volume = Math.max(0, Math.min(1, v0 + (target - v0) * k)); } catch (e) {}
      if (k < 1) humRaf = requestAnimationFrame(st); else done && done(); })(t0); }
  function humOn(){ humWant = true; duck(true); hum.currentTime = 0; hum.play().catch(() => {}); humTo(muted() ? 0 : HUM_VOL, 3000); }
  function humOff(){ if (!humWant) return; humWant = false; humTo(0, 900, () => { if (!humWant){ hum.pause(); duck(false); } }); }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, () => { if (humWant && hum.paused) hum.play().catch(() => {}); }, {passive: true}));

  /* power → ABYSS: лаг-підміна слова */
  const PW = [...KQ.querySelectorAll('.w')].find(w => w.dataset.t === 'power,'), PW0 = 'power,', PA = 'ABYSS,', JUNK = 'ABCDEFGHIKLMNOPRSTUVWXYZ#?!0123456789';
  const junk = n => Array.from({length: n}, () => JUNK[Math.random() * JUNK.length | 0]).join('');
  const setW = (t, abyss, gl) => { PW.textContent = t; PW.dataset.t = t; PW.classList.toggle('fail', abyss); PW.classList.toggle('abyss', abyss); PW.classList.toggle('gl', !!gl); };
  const restoreW = () => PW && setW(PW0, false, false);
  function powerCycle(){
    if (!PW) return; const at = (ms, f) => timers.push(setTimeout(f, ms));
    // power → ABYSS
    setW('p0w#r,', false, true); at(90, () => setW(junk(5), false, true)); at(170, () => setW(PA, true, true));
    at(260, () => setW(PW0, false, true)); at(340, () => setW(PA, true, true)); at(430, () => setW(PA, true, false));
    // тримаємо ABYSS, потім назад
    at(2900, () => setW(junk(5), true, true)); at(3000, () => setW(PA, true, true)); at(3100, () => setW('pow3r', false, true)); at(3200, () => setW(PW0, false, false));
    at(3200 + 5500 + Math.random() * 4500, powerCycle);
  }

  /* ---- купа варіантів глюків для всіх слів, окрім power (його веде powerCycle) ---- */
  const WL = [...KQ.querySelectorAll('.w')]; WL.forEach(w => { w.dataset.o = w.dataset.t; });
  const rnd = n => Math.random() * n | 0, pick = a => a[rnd(a.length)];
  const rest = w => { if (w === PW && PW.classList.contains('abyss')){ w._b = 0; return; } w.textContent = w.dataset.o; w.dataset.t = w.dataset.o; w.className = w.className.replace(/\bg-\w+|\bgl\b/g, '').replace(/\s+/g, ' ').trim(); w._b = 0; };
  const txt = (w, t) => { w.textContent = t; w.dataset.t = t; };
  const gcls = (w, c) => w.classList.add(c);
  const GL = [
    (w, at) => { const o = w.dataset.o; gcls(w, 'gl'); txt(w, junk(o.length)); at(70, () => txt(w, junk(o.length))); at(150, () => { txt(w, o.slice(0, 1) + junk(Math.max(0, o.length - 1))); }); at(240, () => rest(w)); },       // розсип
    (w, at) => { const o = w.dataset.o, a = o[0]; txt(w, a + '-' + a + '-' + o); gcls(w, 'g-jit'); at(110, () => txt(w, a + '-' + o)); at(220, () => txt(w, a + '-' + a + '-' + a + '-' + o)); at(340, () => rest(w)); },     // заїкання
    (w, at) => { const o = w.dataset.o, ch = [...o]; for (let k = 0; k < 1 + rnd(2); k++) ch[rnd(ch.length)] = pick([...JUNK]); gcls(w, 'gl'); txt(w, ch.join('')); at(90, () => { const c2 = [...o]; c2[rnd(c2.length)] = pick([...JUNK]); txt(w, c2.join('')); }); at(200, () => rest(w)); },   // підміна літер
    (w, at) => { const o = w.dataset.o, ch = [...o]; ch.splice(rnd(ch.length), 1 + rnd(2)); gcls(w, 'g-jit'); txt(w, ch.join('')); at(130, () => { txt(w, o + o.slice(-1)); }); at(250, () => rest(w)); },       // випали літери
    (w, at) => { gcls(w, 'g-tear'); at(400, () => rest(w)); },                                                    // розрив зрізами
    (w, at) => { gcls(w, 'g-flip'); at(120, () => w.classList.remove('g-flip')); at(190, () => gcls(w, 'g-flip')); at(310, () => rest(w)); },    // дзеркало
    (w, at) => { gcls(w, 'g-str'); at(100, () => { w.classList.remove('g-str'); gcls(w, 'g-sq'); }); at(210, () => { w.classList.remove('g-sq'); gcls(w, 'g-str'); }); at(300, () => rest(w)); },   // розтяг / сплющення
    (w, at) => { gcls(w, 'g-big'); at(90, () => w.classList.remove('g-big')); at(160, () => gcls(w, 'g-big')); at(250, () => rest(w)); },           // спалах-збільшення
    (w, at) => { gcls(w, 'g-split'); at(110, () => w.classList.remove('g-split')); at(170, () => gcls(w, 'g-split')); at(330, () => rest(w)); },   // роздвоєння
    (w, at) => { gcls(w, 'g-blk'); at(80, () => w.classList.remove('g-blk')); at(140, () => gcls(w, 'g-blk')); at(260, () => rest(w)); },        // чорна діра
    (w, at) => { gcls(w, 'g-tilt'); at(140, () => { w.classList.remove('g-tilt'); gcls(w, 'g-jit'); }); at(280, () => rest(w)); },             // перекіс
    (w, at) => { const o = w.dataset.o; gcls(w, 'gl'); txt(w, o.toLowerCase() === o ? o.toUpperCase() : o.toLowerCase()); at(100, () => txt(w, junk(o.length))); at(190, () => txt(w, o.split('').reverse().join(''))); at(300, () => rest(w)); }   // реверс слова
  ];
  function glitchTick(){
    const burst = Math.random() < .14, n = burst ? 3 + rnd(3) : 1 + rnd(2);
    for (let i = 0; i < n; i++){
      const w = pick(WL); if (w === PW || w._b) continue; w._b = 1;
      const at = (ms, f) => timers.push(setTimeout(f, ms)); pick(GL)(w, at); }
    timers.push(setTimeout(glitchTick, burst ? 1100 + rnd(1200) : 280 + rnd(900)));
  }
  const restoreAll = () => { WL.forEach(w => { if (w !== PW) rest(w); }); KQ.classList.remove('rgb'); KQ.style.visibility = ''; const im = document.querySelector('#kn .who img'); im && im.classList.remove('kgl'); };

  /* ---- глюки з К. К. (ті самі 9 типів, але на словах) ---- */
  const NOISE = '#@%&▓░01?!/\\|<>', rndCh = () => NOISE[rnd(NOISE.length)];
  const free = ex => WL.filter(w => !w._b && !(w === PW && (PW.dataset.t !== PW0 || PW.classList.contains('gl'))) && !(ex && ex(w)));
  function kkSwap(els, fn, ms, cls){
    const run = els.filter(w => !w._b); run.forEach(w => { w._b = 1; txt(w, fn(w)); if (cls) w.classList.add(cls); });
    timers.push(setTimeout(() => run.forEach(w => rest(w)), ms)); }
  const kkFlash = (w, cls, ms) => { if (w._b) return; w._b = 1; w.classList.add(cls); timers.push(setTimeout(() => rest(w), ms)); };
  const KK = [
    function allNoise(){ kkSwap(free(), w => Array.from({length: w.dataset.o.length}, rndCh).join(''), 160 + Math.random() * 160, 'g-kr'); },                 // весь текст на мить — символи
    function blockout(){ kkSwap(free(w => w.classList.contains('fail')), w => '▓'.repeat(w.dataset.o.length), 280 + Math.random() * 220, 'g-bk'); },         // усе закрашено ▓, крім червоного
    function split(){ const f = free(); for (let i = 0; i < Math.min(f.length, 2 + rnd(4)); i++) kkFlash(pick(f), Math.random() < .5 ? 'g-kc' : 'g-kr', 90 + Math.random() * 140); },   // RGB-розкол слів
    function corrupt(){ const f = free(), i = rnd(Math.max(1, f.length)); kkSwap(f.slice(i, i + 3 + rnd(4)), w => Array.from({length: w.dataset.o.length}, rndCh).join(''), 110 + Math.random() * 120, 'g-kr'); },   // кілька слів — сміття
    function stutter(){ const f = free(), i = rnd(Math.max(1, f.length)); f.slice(i, i + 5).forEach(w => kkFlash(w, 'g-st', 260)); },                      // шматок смикається
    function rgb(){ KQ.classList.add('rgb'); timers.push(setTimeout(() => KQ.classList.remove('rgb'), 160)); },                                           // весь текст з RGB-розколом
    function dip(){ KQ.style.visibility = 'hidden'; timers.push(setTimeout(() => KQ.style.visibility = '', 70), setTimeout(() => { KQ.style.visibility = 'hidden'; timers.push(setTimeout(() => KQ.style.visibility = '', 50)); }, 160)); },   // зник і повернувся
    function img(){ const im = document.querySelector('#kn .who img'); im.classList.add('kgl'); timers.push(setTimeout(() => im.classList.remove('kgl'), 150)); },    // картинка смикається
    function tear(){ const f = free(), i = rnd(Math.max(1, f.length)); f.slice(i, i + 3 + rnd(3)).forEach(w => kkFlash(w, 'g-tear', 380)); }                // розрив рядка
  ];
  let lastKK = -1;
  function kkLoop(){
    let k; do { k = rnd(KK.length); } while (k === lastKK); lastKK = k;
    try { KK[k](); } catch (e) {}
    timers.push(setTimeout(kkLoop, 2800 + Math.random() * 1500));   // приблизно раз на 3,5 с, як у К. К.
  }
  const T_DARK = 5000, T_WHO = 2600;   // 5 с на оці, далі темніє; персонаж за 2,6 с після початку вогню
  let timers = [], raf = 0, fireOn = false, parts = [], last = 0, W = 0, H = 0, dpr = 1;

  /* спрайти вогню */
  const spr = (r, g, b) => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.35, `rgba(${r},${g},${b},.45)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; };
  const SP = [spr(255, 50, 30), spr(255, 90, 40), spr(200, 50, 200), spr(140, 60, 255)];

  function size(){ dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function spawn(){
    const x = Math.random() * W, big = Math.random() < .18;
    // ближче до низу — червоний, вище — фіолетовий (колір міняється з висотою в draw)
    parts.push({x, y: H + 20, vx: (Math.random() - .5) * 26, vy: -(70 + Math.random() * 170), s: big ? 80 + Math.random() * 90 : 22 + Math.random() * 42,
      life: 0, max: 1.6 + Math.random() * 2.4, ph: Math.random() * 6.28, w: 18 + Math.random() * 40});
  }
  function loop(ts){
    raf = requestAnimationFrame(loop);
    const dt = Math.min(.05, (ts - (last || ts)) / 1000); last = ts;
    cx.clearRect(0, 0, W, H); cx.globalCompositeOperation = 'lighter';
    if (fireOn){ const n = parts.length < 420 ? 8 : 0; for (let i = 0; i < n * (dt * 60 / 2 + .5) | 0; i++) spawn(); }
    parts = parts.filter(p => p.life < p.max);
    for (const p of parts){
      p.life += dt; const k = p.life / p.max;
      p.x += (p.vx + Math.sin(p.ph + p.life * 2.4) * p.w) * dt; p.y += p.vy * dt; p.vy *= (1 - .12 * dt);
      const h = 1 - Math.max(0, Math.min(1, p.y / H));            // 0 знизу … 1 вгорі
      const idx = h < .25 ? (Math.random() < .5 ? 0 : 1) : h < .5 ? 1 : h < .7 ? 2 : 3;
      const a = Math.sin(Math.PI * Math.min(1, k * 1.15)) * (.5 - h * .3);
      cx.globalAlpha = Math.max(0, a); const s = p.s * (1 - k * .5);
      cx.drawImage(SP[idx], p.x - s * .3, p.y - s * .95, s * .6, s * 1.9);   // витягнуті язики
    }
    cx.globalAlpha = 1;
  }

  function open(){
    if (KN.classList.contains('on')) return;
    size(); parts = []; fireOn = false; last = 0;
    KN.classList.remove('dark', 'fire', 'who-on'); KQ.classList.remove('on'); restoreW(); KN.setAttribute('aria-hidden', 'false'); KN.classList.add('on');
    timers.push(setTimeout(() => { KN.classList.add('dark'); }, T_DARK));
    timers.push(setTimeout(() => { KN.classList.add('fire'); fireOn = !RM; }, T_DARK + 500));
    timers.push(setTimeout(() => { KN.classList.add('who-on'); }, T_DARK + 500 + T_WHO));
    timers.push(setTimeout(() => { KQ.classList.add('on'); }, T_DARK + 500 + T_WHO + 900));
    timers.push(setTimeout(glitchTick, T_DARK + 500 + T_WHO + 900 + 4500));
    timers.push(setTimeout(kkLoop, T_DARK + 500 + T_WHO + 900 + 5500));
    timers.push(setTimeout(powerCycle, T_DARK + 500 + T_WHO + 900 + 7500));
    if (!RM) raf = requestAnimationFrame(loop);
    humOn();
    $('#knx').focus({preventScroll: true});
  }
  function close(){
    timers.forEach(clearTimeout); timers = []; restoreW(); restoreAll(); cancelAnimationFrame(raf); fireOn = false;
    humOff();
    KN.classList.remove('on'); KN.setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!KN.classList.contains('on')){ KN.classList.remove('dark', 'fire', 'who-on'); KQ.classList.remove('on'); cx.clearRect(0, 0, W, H); parts = []; } }, 950);
    pin.focus({preventScroll: true});
  }

  pin.addEventListener('click', e => {
    if (!matchMedia('(hover:hover)').matches && !pin.classList.contains('tap')){ pin.classList.add('tap'); return; }   // телефон: перший тап = картка, другий = відкрити
    pin.classList.remove('tap'); open(); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#kpin')) pin.classList.remove('tap'); });
  $('#knx').addEventListener('click', close);
  addEventListener('keydown', e => { if (e.key === 'Escape' && KN.classList.contains('on')) close(); });
  addEventListener('resize', () => { if (KN.classList.contains('on')) size(); });
  window.__kn = {open, close, T_DARK};
})();
</script>
</body>
